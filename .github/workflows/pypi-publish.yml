name: Publish to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

jobs:
  publish-testpypi:
    if: github.event.inputs.environment == 'test' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/projects/imprint-router

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install build twine

      - name: Get version
        id: version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on Test PyPI
        id: exists-testpypi
        run: |
          EXISTS=$(curl -s "https://test.pypi.org/pypi/imprint-router/${{ steps.version.outputs.version }}/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if d.get('info',{}).get('version') == '${{ steps.version.outputs.version }}' else 'no')" 2>/dev/null || echo "no")
          echo "exists=$EXISTS" >> $GITHUB_OUTPUT
          echo "Version ${{ steps.version.outputs.version }} on Test PyPI: $EXISTS"
          if [ "$EXISTS" == "yes" ]; then
            echo "SKIP_UPLOAD=true" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.exists-testpypi.outputs.SKIP_UPLOAD != 'true'
        run: python -m build

      - name: Publish to Test PyPI
        if: steps.exists-testpypi.outputs.SKIP_UPLOAD != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_TOKEN }}
        run: python -m twine upload --repository testpypi dist/*

  publish-pypi:
    if: github.event.inputs.environment == 'prod' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/projects/imprint-router

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install build twine

      - name: Get version
        id: version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on PyPI
        id: exists-pypi
        run: |
          EXISTS=$(curl -s "https://pypi.org/pypi/imprint-router/${{ steps.version.outputs.version }}/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if d.get('info',{}).get('version') == '${{ steps.version.outputs.version }}' else 'no')" 2>/dev/null || echo "no")
          echo "exists=$EXISTS" >> $GITHUB_OUTPUT
          echo "Version ${{ steps.version.outputs.version }} on PyPI: $EXISTS"
          if [ "$EXISTS" == "yes" ]; then
            echo "SKIP_UPLOAD=true" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.exists-pypi.outputs.SKIP_UPLOAD != 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.exists-pypi.outputs.SKIP_UPLOAD != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/*

      - name: Already published notice
        if: steps.exists-pypi.outputs.SKIP_UPLOAD == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already exists on PyPI — skipping upload"
